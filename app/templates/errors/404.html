{% extends "base.html" %}

{% block title %}404 Not Found{% endblock %}
{% block header_title %}404 Page Not Found{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
  <div class="glass-card" style="padding: 40px;">
    <div style="font-size: 3.5rem; margin-bottom: 16px;">🔍</div>
    <h2 style="font-size: 1.75rem; margin-bottom: 12px;">Endpoint Not Found</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
      The requested resource or page does not exist on this node.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
      &larr; Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
