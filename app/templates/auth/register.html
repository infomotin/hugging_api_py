{% extends "base.html" %}

{% block title %}Register Account | Enterprise RBAC{% endblock %}

{% block public_content %}
<div style="max-width: 460px; margin: 40px auto;">
  <div class="glass-card" style="padding: 36px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 1.4rem;">✨</div>
      <h2 style="font-size: 1.75rem;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Join with default User role permissions</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="johndoe" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
        Register &amp; Access App &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-muted);">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
